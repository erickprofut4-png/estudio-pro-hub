<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ESTÚDIO PRO HUB</title>
  <style>
    :root {
      --bg: #070b08;
      --surface: #0e1510;
      --surface-2: #141f17;
      --border: #1e3324;
      --neon: #22ff66;
      --neon-soft: rgba(34, 255, 102, 0.14);
      --neon-glow: 0 0 18px rgba(34, 255, 102, 0.28);
      --text: #f2fff6;
      --muted: #8ca694;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background:
        radial-gradient(circle at top, rgba(34, 255, 102, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      padding-bottom: 48px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--neon-glow);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--neon);
      text-shadow: 0 0 14px rgba(34, 255, 102, 0.35);
    }

    .brand-sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .pill {
      background: var(--neon-soft);
      color: var(--neon);
      border: 1px solid rgba(34, 255, 102, 0.4);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .tabs {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .tab-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
      user-select: none;
    }

    .tab-btn span {
      pointer-events: none;
    }
